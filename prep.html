<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interview Prep</title>
<link rel="stylesheet" href="/theme.css">
<style>
main{padding-bottom:64px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:22px 0 18px}
.tab{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:14px;cursor:pointer;transition:border-color .15s}
.tab:hover{border-color:var(--fg)}
.tab .ti{flex:none;width:36px;height:36px;border-radius:11px;background:var(--sunken);color:var(--mute);display:grid;place-items:center}
.tab .ti svg{width:19px;height:19px}
.tab b{display:block;font-size:15px}.tab span{font-size:13px;color:var(--faint);line-height:1.35;display:block;margin-top:1px}
.tab.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 50%,var(--surface))}
.tab.on .ti{background:var(--accent);color:#fff}
.tab .num{font-weight:700;color:var(--accent-ink)}
.sec{padding:20px}.sec h3{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:14px;align-items:start}
textarea.in{min-height:96px}
.md h1{font-size:22px;margin:0 0 6px}.md h2{font-size:16px;margin:20px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
.md ul{margin:4px 0;padding-left:20px}.md li{margin:4px 0}.md p{margin:6px 0}
.links{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.qlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.q{padding:16px 18px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.q:first-child{border-top:0}
.q b{font-size:15.5px;line-height:1.4}
.q .qtip{font-size:13.5px;color:var(--mute);margin-top:4px}
.story{padding:16px 18px;border-top:1px solid var(--line)}
.story:first-child{border-top:0}
.story b{font-size:16px}
.star{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;font-size:14px;margin-top:10px}
.star span{color:var(--accent-ink);font-weight:700;font-size:13px}
.cov{display:flex;flex-wrap:wrap;gap:6px}
.big-q{font-size:24px;line-height:1.3;font-weight:700;margin:10px 0 6px;letter-spacing:-.015em;text-wrap:balance}
.timer{font:800 32px/1 var(--f-display);font-variant-numeric:tabular-nums;min-width:86px}
.timer.over{color:var(--bad)}
.rub{display:grid;gap:2px}
.rub label{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 0;cursor:pointer}
.fb{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.steps-ol{margin:0;padding-left:20px;font-size:14px;color:var(--mute)}.steps-ol li{margin:6px 0}
@media (max-width:980px){.tabs{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.tabs{gap:8px}.tab{padding:10px}.tab span{display:none}.tab .ti{width:30px;height:30px}.q{grid-template-columns:1fr}.star{grid-template-columns:1fr}.big-q{font-size:20px}}
</style>
</head>
<body>
<header class="appbar" data-page="prep"><div class="wrap">
  <span class="grow"></span><span class="pill" id="aiPill"></span>
</div></header>
<script src="/ui.js"></script>
<main class="wrap">
  <section class="pagehead"><div class="grow">
    <h1>Interview prep</h1>
    <p>Got an interview? Nice work. Research the company, rehearse likely questions, build your stories, then practise out loud. Do the tabs in order the first time.</p>
  </div></section>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="view"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const {toast, ICONS, tip: gtip, empty} = Jobber;
async function api(url, body) {
  const r = await fetch(url, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const d = await r.json(); if (!r.ok) throw new Error(d.error || r.status); return d;
}
function md(s) {  // tiny markdown: headings, bullets, bold, paragraphs
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  let out = [], ul = false;
  for (const ln of String(s || "").split("\n")) {
    const l = ln.trim();
    if (/^[-*] /.test(l)) { if (!ul) { out.push("<ul>"); ul = true; } out.push(`<li>${inl(l.slice(2))}</li>`); continue; }
    if (ul) { out.push("</ul>"); ul = false; }
    const h = l.match(/^(#{1,3}) (.*)/);
    if (h) out.push(`<h${h[1].length}>${inl(h[2])}</h${h[1].length}>`); else if (l) out.push(`<p>${inl(l)}</p>`);
  }
  if (ul) out.push("</ul>");
  return out.join("");
}

let D = null, tab = "brief", ROLE = "general", BRIEF = null;
const TABS = [["brief", "Company brief", "Know who you're talking to", "book"], ["questions", "Question bank", "What they'll likely ask", "chat"], ["stories", "Story bank", "Your best examples, STAR-style", "star"], ["mock", "Mock practice", "Say it out loud, on a timer", "mic"]];
async function load() {
  D = await api("/api/prep");
  ROLE = ROLE === "general" ? D.default_role : ROLE;
  $("#aiPill").textContent = D.ai ? "AI on" : "AI off · templates";
  $("#aiPill").className = "pill " + (D.ai ? "good" : "");
  render();
}
function go(t) { tab = t; render(); }
function render() {
  $("#tabs").innerHTML = TABS.map(([k, l, d, ic], i) => `<button class="tab ${tab === k ? "on" : ""}" role="tab" aria-selected="${tab === k}" onclick="go('${k}')"><span class="ti">${ICONS[ic]}</span><div><b>${i + 1}. ${l}${k === "stories" && D.stories.length ? ` <span class="num" style="display:inline">· ${D.stories.length}</span>` : ""}</b><span>${d}</span></div></button>`).join("");
  ({brief, questions, stories, mock})[tab]();
}

/* ---------------- Company brief ---------------- */
function brief() {
  const jobId = new URLSearchParams(location.search).get("job") || "";
  const opts = D.jobs.map(j => `<option value="${j.id}" ${j.id === jobId ? "selected" : ""}>${esc(j.company)}: ${esc(j.title)} (${j.status})</option>`).join("");
  $("#view").innerHTML = `<div class="grid2">
    <div class="panel sec"><h3>Pick the interview ${gtip("brief")}</h3>
      <label class="label">From your tracker</label>
      <select class="in" id="bJob"><option value="">Choose a job…</option>${opts}</select>
      <div class="small muted" style="margin:12px 0 6px">or type it in</div>
      <div style="display:grid;gap:6px"><input class="in" id="bCo" placeholder="Company name"><input class="in" id="bTitle" placeholder="Role title (optional)">
      <textarea class="in" id="bJd" placeholder="Paste the job description (optional, makes the brief much better)"></textarea></div>
      <div class="row" style="margin-top:10px"><button class="btn primary" onclick="makeBrief(false)">Build brief</button>
      ${D.ai ? `<button class="btn" onclick="makeBrief(true)">Build with AI</button>` : `<span class="small muted">Add a Claude API key in Copilot → Setup for AI briefs.</span>`}</div>
    </div>
    <div class="panel sec"><h3>How to prepare in about an hour</h3><ol class="steps-ol">
      <li>Build the brief, open the research links and add 3-5 facts to your notes.</li>
      <li>Read "What they want" and match a story from your Story bank to each point.</li>
      <li>Practise the likely questions out loud on Mock practice (2 minutes each).</li>
      <li>Pick 2-3 questions to ask them. Write down why you want this job in one sentence.</li></ol></div>
  </div><div id="bOut" style="margin-top:12px"></div>`;
  if (jobId) makeBrief(false);
}
async function makeBrief(ai) {
  const out = $("#bOut"); out.innerHTML = `<div class="muted">${ai ? "Writing with AI (10-30s)…" : "Building…"}</div>`;
  try {
    BRIEF = await api("/api/prep/brief", {job_id: $("#bJob").value, company: $("#bCo").value, title: $("#bTitle").value, jd: $("#bJd").value, ai});
    ROLE = BRIEF.role || ROLE;
    out.innerHTML = `<div class="grid2"><div class="panel sec md">${md(BRIEF.markdown)}</div>
      <div><div class="panel sec"><h3>Research links</h3><div class="links">${Object.entries(BRIEF.links).map(([k, u]) => `<a class="btn sm" target="_blank" rel="noopener" href="${esc(u)}">${esc(k)} ↗</a>`).join("")}</div></div>
      <div class="panel sec" style="margin-top:12px"><h3>Your notes on ${esc(BRIEF.company)}</h3>
        <textarea class="in" id="bNotes" style="min-height:160px" placeholder="What they sell, to whom, recent news, interviewer names, why you want it…">${esc(BRIEF.notes)}</textarea>
        <div class="row" style="margin-top:8px"><button class="btn sm primary" onclick="saveNotes()">Save notes</button>
        <button class="btn sm" onclick="practiseThese()">Practise these questions →</button></div></div></div></div>`;
  } catch (e) { out.innerHTML = `<div class="notice">${esc(e.message)}</div>`; }
}
async function saveNotes() { await api("/api/prep/notes", {company: BRIEF.company, notes: $("#bNotes").value}); toast("Notes saved"); }
function practiseThese() { MOCKQ = BRIEF.questions.map(q => q.q); MI = 0; go("mock"); }

/* ---------------- Question bank ---------------- */
function questions() {
  const r = D.roles[ROLE] || D.roles.general;
  $("#view").innerHTML = `<div class="row" style="margin-bottom:10px">${Object.entries(D.roles).map(([k, v]) => `<button class="chip ${ROLE === k ? "on" : ""}" onclick="ROLE='${k}';render()">${esc(v.label)}</button>`).join("")}</div>
    <div class="small muted" style="margin-bottom:10px">${r.questions.length} questions people really get asked. Press Practised each time you answer one out loud. Add your own in questions.json.</div>
    <div class="qlist">${r.questions.map((q, i) => `<div class="q"><div><b>${esc(q.q)}</b><div class="qtip"><span class="pill">${esc(q.type)}</span> ${esc(q.tip)}</div></div>
      <div class="row">${D.practiced[q.q] ? `<span class="pill good">Practised ${D.practiced[q.q]}×</span>` : ""}
      <button class="btn sm" onclick="practised(${i})">Practised</button><button class="btn sm ghost" onclick="MOCKQ=[D.roles[ROLE].questions[${i}].q];MI=0;go('mock')">Mock it →</button></div></div>`).join("")}</div>
    <div class="panel sec" style="margin-top:14px"><h3>Questions to ask them</h3><ul class="small" style="margin:0;padding-left:18px">${D.ask_them.map(q => `<li>${esc(q)}</li>`).join("")}</ul></div>`;
}
async function practised(i) { const q = D.roles[ROLE].questions[i].q; await api("/api/prep/practiced", {question: q}); D.practiced[q] = (D.practiced[q] || 0) + 1; render(); }

/* ---------------- Story bank ---------------- */
let EDIT = null;
function stories() {
  const covered = new Set(D.stories.flatMap(s => s.tags));
  const f = EDIT || {title: "", situation: "", task: "", action: "", result: "", tags: []};
  $("#view").innerHTML = `<div class="grid2">
    <div class="panel sec"><h3>${EDIT && EDIT.id ? "Edit story" : "Add a STAR story"} ${gtip("star")}</h3>
      <div class="small muted" style="margin-bottom:8px">5-6 strong stories answer most behavioural questions. Keep each to about 2 minutes spoken. Use real numbers.</div>
      <div style="display:grid;gap:6px">
      <input class="in" id="sTitle" placeholder="Short title, e.g. 'Cut onboarding drop-off 30%'" value="${esc(f.title)}">
      <textarea class="in" id="sS" placeholder="Situation: where, when, what was the context?">${esc(f.situation)}</textarea>
      <textarea class="in" id="sT" placeholder="Task: what were you responsible for? What was at stake?">${esc(f.task)}</textarea>
      <textarea class="in" id="sA" placeholder="Action: what did YOU do? (say 'I', not 'we')">${esc(f.action)}</textarea>
      <textarea class="in" id="sR" placeholder="Result: what changed? Numbers, and what you learned.">${esc(f.result)}</textarea>
      <div class="label" style="margin-top:4px">Shows these competencies</div>
      <div class="cov" id="sTags">${D.competencies.map(c => `<button class="chip ${f.tags.includes(c) ? "on" : ""}" onclick="this.classList.toggle('on')">${esc(c)}</button>`).join("")}</div></div>
      <div class="row" style="margin-top:10px"><button class="btn primary" onclick="saveStory()">Save story</button>${EDIT ? `<button class="btn ghost" onclick="EDIT=null;render()">Cancel</button>` : ""}</div></div>
    <div class="panel sec"><h3>Coverage ${gtip("competency")}</h3><div class="small muted" style="margin-bottom:10px">Aim for at least one story per competency. Green means covered.</div>
      <div class="cov">${D.competencies.map(c => `<span class="pill ${covered.has(c) ? "good" : "warn"}">${covered.has(c) ? "✓" : "○"} ${esc(c)}</span>`).join("")}</div></div>
  </div>
  <div style="margin-top:14px">${D.stories.length ? `<div class="qlist">` : ""}${D.stories.map((s, i) => `<div class="story"><div class="row" style="justify-content:space-between"><b>${esc(s.title)}</b>
     <div class="row"><button class="btn sm" onclick="EDIT=D.stories[${i}];render();scrollTo(0,0)">Edit</button><button class="btn sm ghost" onclick="delStory(${s.id})">Delete</button></div></div>
     <div class="row" style="margin-top:4px">${s.tags.map(t => `<span class="pill">${esc(t)}</span>`).join("")}</div>
     <div class="star"><span>Situation</span><div>${esc(s.situation)}</div><span>Task</span><div>${esc(s.task)}</div><span>Action</span><div>${esc(s.action)}</div><span>Result</span><div>${esc(s.result)}</div></div></div>`).join("")}${D.stories.length ? "</div>" : empty({icon: "star", title: "No stories yet", body: "Write your first one with the form above. Think of a time you fixed a problem, led something, or changed someone's mind. Real numbers make it memorable."})}</div>`;
}
async function saveStory() {
  const tags = [...document.querySelectorAll("#sTags .chip.on")].map(b => b.textContent);
  try {
    const r = await api("/api/prep/story", {id: EDIT && EDIT.id, title: $("#sTitle").value, situation: $("#sS").value, task: $("#sT").value, action: $("#sA").value, result: $("#sR").value, tags});
    D.stories = r.stories; EDIT = null; toast("Story saved"); render();
  } catch (e) { toast(e.message); }
}
async function delStory(id) { if (!confirm("Delete this story?")) return; D.stories = (await api("/api/prep/story", {id, delete: true})).stories; render(); }

/* ---------------- Mock practice ---------------- */
let MOCKQ = null, MI = 0, T0 = 0, TICK = null, LIMIT = 120;
function pickQs() { const qs = (D.roles[ROLE] || D.roles.general).questions.map(q => q.q); return qs.sort(() => Math.random() - .5).slice(0, 5); }
function mock() {
  if (!MOCKQ || !MOCKQ.length) { MOCKQ = pickQs(); MI = 0; }
  const q = MOCKQ[MI % MOCKQ.length];
  const tip = Object.values(D.roles).flatMap(r => r.questions).find(x => x.q === q);
  $("#view").innerHTML = `<div class="grid2"><div class="panel sec">
      <div class="row" style="justify-content:space-between"><span class="label">Question ${MI % MOCKQ.length + 1} of ${MOCKQ.length} ${gtip("mock")}</span>
      <select class="in" style="width:auto" onchange="ROLE=this.value;MOCKQ=pickQs();MI=0;render()">${Object.entries(D.roles).map(([k, v]) => `<option value="${k}" ${k === ROLE ? "selected" : ""}>${esc(v.label)}</option>`).join("")}</select></div>
      <div class="big-q">${esc(q)}</div>${tip ? `<div class="small muted">${esc(tip.tip)}</div>` : ""}
      <div class="row" style="margin:14px 0 8px"><span class="timer" id="timer">2:00</span>
        <button class="btn" id="tBtn" onclick="timer()">Start 2-min timer</button>
        <select class="in" style="width:auto" onchange="LIMIT=+this.value;$('#timer').textContent=fmt(LIMIT)"><option value="60">1 min</option><option value="120" selected>2 min</option><option value="180">3 min</option></select></div>
      <textarea class="in" id="ans" style="min-height:160px" placeholder="Answer out loud first. Then jot your answer here (bullet points are fine) to review it."></textarea>
      <div class="label" style="margin:14px 0 4px;color:var(--fg)">Check your answer: did you…</div>
      <div class="rub">${["Clear structure (STAR or a framework)", "Specific example, not hypothetical", "Numbers or concrete result", "Clear about MY role ('I', not 'we')", "Under the time limit", "Ended with what I learned or why it matters"].map(r => `<label><input type="checkbox" class="rb"> ${r}</label>`).join("")}</div>
      <div class="row" style="margin-top:12px"><button class="btn primary" onclick="saveMock(false)">Save & next</button>
        ${D.ai ? `<button class="btn" onclick="saveMock(true)">Get AI feedback</button>` : ""}
        <button class="btn ghost" onclick="MI++;render()">Skip</button><button class="btn ghost" onclick="MOCKQ=pickQs();MI=0;render()">New set</button></div>
      <div id="fb"></div></div>
    <div class="panel sec"><h3>Recent practice</h3>${D.mocks.length ? `<div>${D.mocks.slice(0, 12).map(m => {
        const f = m.feedback ? JSON.parse(m.feedback) : null;
        return `<div class="story"><b style="font-size:14px">${esc(m.question)}</b><div class="small muted">${m.created.slice(0, 10)} · self-score ${m.rating}/6${f ? ` · AI ${f.score}/5` : ""}${m.seconds ? ` · ${fmt(m.seconds)}` : ""}</div></div>`; }).join("")}</div>`
      : empty({icon: "mic", title: "No practice yet", body: "Start the timer, answer out loud as if you're in the room, then tick the checklist. Your history builds up here."})}</div></div>`;
}
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
function timer() {
  if (TICK) { clearInterval(TICK); TICK = null; $("#tBtn").textContent = "Restart timer"; return; }
  T0 = Date.now(); $("#tBtn").textContent = "Stop";
  TICK = setInterval(() => { const el = $("#timer"); if (!el) { clearInterval(TICK); TICK = null; return; }
    const left = LIMIT - Math.round((Date.now() - T0) / 1000); el.textContent = (left < 0 ? "-" : "") + fmt(Math.abs(left)); el.classList.toggle("over", left < 0); }, 250);
}
async function saveMock(ai) {
  const q = MOCKQ[MI % MOCKQ.length], secs = T0 ? Math.round((Date.now() - T0) / 1000) : 0;
  const rating = document.querySelectorAll(".rb:checked").length;
  if (TICK) { clearInterval(TICK); TICK = null; }
  if (ai) $("#fb").innerHTML = `<div class="muted small" style="margin-top:10px">Getting feedback (10-30s)…</div>`;
  try {
    const r = await api("/api/prep/mock", {role: ROLE, question: q, answer: $("#ans").value, rating, seconds: secs, ai});
    D.mocks.unshift({question: q, rating, seconds: secs, created: new Date().toISOString(), feedback: r.feedback ? JSON.stringify(r.feedback) : null});
    D.practiced[q] = (D.practiced[q] || 0) + 1; T0 = 0;
    if (ai && r.feedback) { const f = r.feedback;
      $("#fb").innerHTML = `<div class="fb"><b>Score ${f.score}/5</b><div class="label" style="margin-top:8px">Strengths</div><ul>${f.strengths.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
        <div class="label">Improve</div><ul>${f.improve.map(x => `<li>${esc(x)}</li>`).join("")}</ul><div class="label">A tighter version</div><p>${esc(f.better_answer)}</p>
        <button class="btn sm primary" onclick="MI++;render()">Next question →</button></div>`;
    } else { toast(`Saved: ${rating}/6 on the checklist`); MI++; render(); }
  } catch (e) { $("#fb").innerHTML = `<div class="notice" style="margin-top:10px">${esc(e.message)}</div>`; }
}
load().catch(e => $("#view").innerHTML = `<div class="notice">${esc(e.message)}</div>`);
</script>
</body>
</html>
